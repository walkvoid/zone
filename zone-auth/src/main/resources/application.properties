# ============================================
# Zone Auth 服务配置
# ============================================
spring.application.name=zone-auth
server.port=8085
spring.profiles.active=dev

# Nacos 注册中心
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848

# OpenFeign
spring.cloud.openfeign.okhttp.enabled=true

# JWT 配置（需与 gateway / 其它验签服务保持一致）
wv.jwt.secret=c2VjdXJlLXNlY3JldC1rZXktZm9yLXpvbmUtYXBwbGljYXRpb24tMjAyNQ==
wv.jwt.access-token-expiration=900000
wv.jwt.refresh-token-expiration=604800000

# 权限存储：token=写入 JWT（默认）；cache=写入 Redis（需配置 spring.data.redis.*）
wv.security.permission-store=token
wv.security.permission-source-url=http://127.0.0.1:8083/internal/permission/codes/{userId}
# 认证接口放行（覆盖默认列表时需一并写上 swagger / internal）
wv.security.permit-all-paths=/auth/login,/auth/register,/auth/sms/send,/auth/sms/login,/auth/refresh,/auth/logout,/internal/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/doc.html,/webjars/**
# wv.security.permission-cache-ttl=15m
# spring.data.redis.host=127.0.0.1
# spring.data.redis.port=6379

# springdoc OpenAPI 配置
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Knife4j 增强配置
knife4j.enable=true
knife4j.setting.enable-footer=false

# MyBatis-Plus 配置
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
