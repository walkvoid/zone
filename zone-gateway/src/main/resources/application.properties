# ============================================
# Zone Gateway 配置
# ============================================
server.port=8080
spring.profiles.active=dev

# JWT 配置
jwt.secret=c2VjdXJlLXNlY3JldC1rZXktZm9yLXpvbmUtYXBwbGljYXRpb24tMjAyNQ==
jwt.access-token-expiration=604800000
jwt.refresh-token-expiration=2592000000

# Spring Security debug
logging.level.org.springframework.security=DEBUG

# ============================================
# Spring Cloud Gateway 路由配置
# ============================================
# Finance 服务路由
spring.cloud.gateway.routes[0].id=zone-finance
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/finance/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=0

# User 服务路由
spring.cloud.gateway.routes[1].id=zone-user
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/user/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=0

# System 服务路由
spring.cloud.gateway.routes[2].id=zone-system
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/auth/**,/menu/**,/system/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=0

# AI 服务路由
spring.cloud.gateway.routes[3].id=zone-ai
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/ai/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=0
