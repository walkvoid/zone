# ============================================
# Zone Gateway 配置
# ============================================
spring.application.name=zone-gateway
server.port=8080
spring.profiles.active=dev

# Nacos 注册中心
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848

# JWT 配置（需与 auth 保持一致）
wv.jwt.secret=c2VjdXJlLXNlY3JldC1rZXktZm9yLXpvbmUtYXBwbGljYXRpb24tMjAyNQ==
wv.jwt.access-token-expiration=900000
wv.jwt.refresh-token-expiration=604800000

# 权限存储：token | cache（与 auth 等服务保持一致）
wv.security.permission-store=token
wv.security.permission-source-url=http://127.0.0.1:8083/internal/permission/codes/{userId}
# spring.data.redis.host=127.0.0.1
# spring.data.redis.port=6379

# Spring Security debug
logging.level.org.springframework.security=DEBUG

# ============================================
# Spring Cloud Gateway 路由配置（Nacos + LoadBalancer）
# ============================================
# Finance 服务路由
spring.cloud.gateway.routes[0].id=zone-finance
spring.cloud.gateway.routes[0].uri=lb://zone-finance
spring.cloud.gateway.routes[0].predicates[0]=Path=/finance/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=0

# User 服务路由
spring.cloud.gateway.routes[1].id=zone-user
spring.cloud.gateway.routes[1].uri=lb://zone-user
spring.cloud.gateway.routes[1].predicates[0]=Path=/user/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=0

# Auth 服务路由（登录、注册、Token）
spring.cloud.gateway.routes[2].id=zone-auth
spring.cloud.gateway.routes[2].uri=lb://zone-auth
spring.cloud.gateway.routes[2].predicates[0]=Path=/auth/login,/auth/register,/auth/sms/**,/auth/refresh,/auth/logout
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=0

# System 服务路由（权限码、菜单、系统管理）
spring.cloud.gateway.routes[3].id=zone-system
spring.cloud.gateway.routes[3].uri=lb://zone-system
spring.cloud.gateway.routes[3].predicates[0]=Path=/auth/codes,/menu/**,/system/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=0

# AI 服务路由
spring.cloud.gateway.routes[4].id=zone-ai
spring.cloud.gateway.routes[4].uri=lb://zone-ai
spring.cloud.gateway.routes[4].predicates[0]=Path=/ai/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=0

# 流式聊天等长连接：放宽网关读超时
spring.cloud.gateway.httpclient.connect-timeout=10000
spring.cloud.gateway.httpclient.response-timeout=300s
