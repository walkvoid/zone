# ============================================
# Zone AI 服务配置
# ============================================
server.port=8084
spring.profiles.active=lls

# MyBatis-Plus 配置
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# springdoc OpenAPI 配置
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Knife4j 增强配置
knife4j.enable=true
knife4j.setting.enable-footer=false

# ============================================
# Apache Dubbo 配置
# ============================================
dubbo.application.name=zone-ai-provider
dubbo.protocol.name=dubbo
dubbo.protocol.port=20883
# 注册中心地址（使用 Nacos 时取消下面的注释）
# dubbo.registry.address=nacos://localhost:8848

# Qdrant向量数据库 Spring AI自动装配
spring.ai.vectorstore.qdrant.host=172.16.205.4
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.api-key=Qdrant@RAG2026DevJiang
spring.ai.vectorstore.qdrant.collection-name=supply_finance_rag
spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.use-tls=false
spring.ai.vectorstore.qdrant.content-field-name=doc_content
