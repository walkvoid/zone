# ============================================
# Zone AI 服务配置
# ============================================
server.port=8084
spring.profiles.active=lls

# MyBatis-Plus 配置
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# springdoc OpenAPI 配置
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Knife4j 增强配置
knife4j.enable=true
knife4j.setting.enable-footer=false

# 企微收包排查：默认 INFO 就能在控制台看到 inbound / cmd
logging.level.com.github.walkvoid.zone.ai.business.channel=INFO
logging.level.com.github.walkvoid.zone.ai.business.agent=INFO

# ============================================
# Apache Dubbo 配置
# ============================================
dubbo.application.name=zone-ai-provider
dubbo.protocol.name=dubbo
dubbo.protocol.port=20883
# 注册中心地址（使用 Nacos 时取消下面的注释）
# dubbo.registry.address=nacos://localhost:8848

# ============================================
# Spring JDBC / MyBatis 主数据源（库名 zone-ai）
# 与 SqlQueryTool 同一台 MySQL、同一账号；默认库为 zone-ai。
# 账号密码请放在 application-lls.properties。
# ============================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.url=jdbc:mysql://xxx.com:3306/zone-ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.username=
# spring.datasource.password=
spring.datasource.hikari.pool-name=zone-ai-app
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000

# ============================================
# 供应链业务库只读查询（SqlQueryTool / MCP）
# 账号密码请放在 application-lls.properties，不要提交明文。
# SqlQueryTool 按 SQL 里的 jinkoscf_* 跨库查询。
# ============================================
zone.ai.tool.sql.enabled=true
#zone.ai.tool.sql.url=jdbc:mysql://xxx.com:3306/?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
# zone.ai.tool.sql.username=
# zone.ai.tool.sql.password=
zone.ai.tool.sql.allowed-tables=jinkoscf_tools.auth_role,jinkoscf_tools.user_info,jinkoscf_tools.sso_account,jinkoscf_tools.user_cust_rel,jinkoscf_tools.user_cust_role_rel,jinkoscf_tools.media_file,jinkoscf_business_common.contract_info,jinkoscf_business_common.contract_sign_info,jinkoscf_business_common.contract_trade_relation,jinkoscf_business_common.contract_trade_info,jinkoscf_business_common.invoice_business_rel,jinkoscf_business_common.cust_company_info,jinkoscf_business_common.apply_cust_company_info,jinkoscf_business_common.cust_role_info,jinkoscf_business_common.asset_info,jinkoscf_business_common.limit_info,jinkoscf_transaction.ts_asset,jinkoscf_transaction.ts_asset_abolish_apply,jinkoscf_transaction.ts_transaction,jinkoscf_transaction.ts_cash_fee,jinkoscf_transaction.pay_trade,jinkoscf_transaction.pay_trade_funder_record,jinkoscf_gateway.thirdparty_channel_invoked_log,jinkoscf_gateway.http_mock_rule,jinkoscf_gateway.http_request_log
zone.ai.tool.sql.max-rows=50
zone.ai.tool.sql.hard-max-rows=200
zone.ai.tool.sql.query-timeout-seconds=10

# ============================================
# BeeCloud 日志搜索（AppLogSearchTool）
# 账号密码请放在 application-lls.properties 或环境变量 BEELOG_USERNAME / BEELOG_PASSWORD。
# token 缓存在本地文件，过期后自动 SSO 登录刷新。
# ============================================
zone.ai.tool.beecloud.enabled=true
zone.ai.tool.beecloud.base-url=https://beecloud.llschain.com
# zone.ai.tool.beecloud.auth-base-url=
# zone.ai.tool.beecloud.username=
# zone.ai.tool.beecloud.password=
zone.ai.tool.beecloud.tenant-id=8b434d97-87ab-49f9-a82d-8d3c82df6d5e
zone.ai.tool.beecloud.project=jinkoscf
zone.ai.tool.beecloud.token-file=${user.home}/.zone-ai/beecloud-token
zone.ai.tool.beecloud.request-timeout-seconds=20

# ============================================
# 代码沙箱只读（RepoReadTool）
# 只读 D:/ai-sandbox/zone，不要指向正在开发的工作区。
# ============================================
zone.ai.tool.repo.enabled=true
zone.ai.tool.repo.name=jincoscf
# .properties 里反斜杠是转义符，Windows 路径必须写成正斜杠
zone.ai.tool.repo.root=D:/project/jinkoscf
zone.ai.tool.repo.allow-paths=**
# 允许沙箱内全部路径（仍禁止 .env、密钥、..）可写成：
# zone.ai.tool.repo.allow-paths=**
zone.ai.tool.repo.max-read-lines=400
zone.ai.tool.repo.max-search-results=50
zone.ai.tool.repo.max-file-bytes=524288
# 写代码（默认关；开启后仍禁止 pom.xml、application*.properties、密钥文件）
zone.ai.tool.repo.write-enabled=false
# DIFF_FILE=只写同级 unified diff；DIRECT=直接改沙箱源文件
zone.ai.tool.repo.write-mode=DIFF_FILE
# zone.ai.tool.repo.write-allow-paths=zone-finance/**
zone.ai.tool.repo.max-patch-lines=400
zone.ai.tool.repo.max-patch-bytes=524288
zone.ai.tool.repo.patch-context-lines=3

# ============================================
# 企微群会话记忆（内存；重启丢失）
# 群：weixin:{chatid}；单聊：weixin:single:{userid}
# @机器人 新对话 / 清空上下文 可立刻清空
# ============================================
zone.ai.agent.memory.max-messages=20
zone.ai.agent.memory.idle-ttl-minutes=45
zone.ai.agent.memory.max-message-chars=1500

# ============================================
# Spring AI MCP Server（把 @Tool 暴露给 Cursor / 其它 Agent）
# ============================================
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=zone-ai-log
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=SSE

# ============================================
# Qdrant 向量数据库
# ============================================
spring.ai.vectorstore.qdrant.host=172.16.205.4
spring.ai.vectorstore.qdrant.port=6334
# spring.ai.vectorstore.qdrant.api-key=
spring.ai.vectorstore.qdrant.collection-name=supply_finance_rag
spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.use-tls=false
spring.ai.vectorstore.qdrant.content-field-name=doc_content

# ============================================
# OpenAI 兼容私有网关
# ============================================
spring.ai.openai.base-url=https://atk.llschain.com
# spring.ai.openai.api-key=
spring.ai.openai.http-client.connect-timeout=30s
spring.ai.openai.http-client.read-timeout=60s
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.openai.chat.options.model=deepseek/deepseek-v4-pro
