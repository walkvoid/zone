# Test profile - disable infra not needed for embedding/vector tests
spring.profiles.active=lls

# Disable Dubbo (no registry needed)
dubbo.enabled=false

# Disable MyBatis + DataSource (no MySQL needed)
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration,\
  org.apache.dubbo.spring.boot.autoconfigure.DubboAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,\
  com.baomidou.lock.spring.boot.autoconfigure.LockAutoConfiguration
