# ============================================
# Zone User 服务配置
# ============================================
spring.application.name=zone-user
server.port=8082
spring.profiles.active=dev

# Nacos 注册中心
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848

# HTTP Service clients (@HttpExchange / @ImportHttpServices)
spring.http.serviceclient.zone-auth.base-url=lb://zone-auth

# JWT 配置（需与 auth 保持一致）
wv.jwt.secret=c2VjdXJlLXNlY3JldC1rZXktZm9yLXpvbmUtYXBwbGljYXRpb24tMjAyNQ==
wv.jwt.access-token-expiration=900000
wv.jwt.refresh-token-expiration=604800000

# 权限存储：token | cache（与 auth 等服务保持一致）
wv.security.permission-store=token
wv.security.permission-source-url=http://127.0.0.1:8083/internal/permission/codes/{userId}
# spring.data.redis.host=127.0.0.1
# spring.data.redis.port=6379

# MyBatis-Plus 配置
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# springdoc OpenAPI 配置
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Knife4j 增强配置
knife4j.enable=true
knife4j.setting.enable-footer=false
